name = "use-craft-apps"
compatibility_date = "2026-10-26"

# Cloudflare Pages build settings (set in dashboard or via Wrangler):
#   Build command: bash prepare-cloudflare.sh
#   Build output directory: workspace/public
# prepare-cloudflare.sh materializes LFS assets, splits oversized WASM, and
# installs the client-side stitching bootstrap.

# Cloudflare Workers static assets (used when deploying with `wrangler deploy`):
[assets]
directory = "./workspace/public"
