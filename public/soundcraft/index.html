<script type="module">
import init, * as bindings from './soundcraft-web-e252b3204bb8f95f.js';
const wasm = await init({ module_or_path: './soundcraft-web-e252b3204bb8f95f_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

    #soundcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #soundcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;

<body>
  <canvas id="soundcraft_canvas"></canvas>
  <script>
    // cpal (wasm) builds the output stream at startup, before any user gesture, so the
    // WebAudio AudioContext stays 'suspended': no audio is heard and the transport clock
    // (driven by the audio callback) never advances. Capture the AudioContext cpal creates
    // and resume it on the first user gesture. Runs before the wasm module is instantiated.
    (function () {
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      var ctxs = [];
      function Wrapped(opts) { var c = new Orig(opts); ctxs.push(c); return c; }
      Wrapped.prototype = Orig.prototype;
      window.AudioContext = Wrapped;
      if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
      function resumeAll() {
        ctxs.forEach(function (c) { if (c.state === 'suspended') { c.resume().catch(function () {}); } });
      }
      ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, resumeAll, { capture: true });
      });
    })();
  </script>
  <div id="soundcraft_loading">Loading SoundCraft&hellip;</div>
</body>
