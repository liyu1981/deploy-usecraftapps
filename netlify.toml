[build]
  command = "bash prepare-public.sh"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*/app/*-web.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*/app/parts.txt"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*/app/*.part-*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*-web-boot-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*/fonts/manifest.txt"
  [headers.values]
    Cache-Control = "no-cache"
