[build]
  command = "bash prepare-public.sh"
  publish = "public"

[build.environment]
  GIT_LFS_ENABLED = "true"
  # Needed before clone on Netlify; also set this in the site UI for it to take effect.
  GIT_LFS_FETCH_INCLUDE = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*/app/*-web.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*/app/parts.txt"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*/app/*.part-*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*-web-boot-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*/fonts/manifest.txt"
  [headers.values]
    Cache-Control = "no-cache"
